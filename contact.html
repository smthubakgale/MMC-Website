<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazibuko Medical - Contact</title>

    <!-- Favicon -->
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <link rel="shortcut icon" href="img/logo.ico" type="image/x-icon">

    <!-- Optional Meta -->
    <meta name="description" content="Contact Mazibuko Medical Clinic">
    <meta name="author" content="Tevrocsoft">
    <meta name="developer" content="Tevrocsoft - https://tevrocsoft.netlify.app">

    <!-- Open Graph -->
    <meta property="og:title" content="Mazibuko Medical - Contact">
    <meta property="og:description" content="Contact Mazibuko Medical Clinic">
    <meta property="og:image" content="img/logo.png">
    <meta property="og:type" content="website">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-20">
        <!-- Contact Hero -->
        <section class="mb-16 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Contact Us</h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">Have questions or need to schedule an appointment? Our team is here to help.</p>
        </section>

        <!-- Contact Section -->
        <section class="mb-16">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Contact Info Cards -->
                <div class="space-y-6">
                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4">
                                <i data-feather="map-pin" class="text-blue-600 w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold mb-2">Our Location</h3>
                                <p class="text-gray-600">123 Medical Drive, Health City, HC 12345</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4">
                                <i data-feather="mail" class="text-blue-600 w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold mb-2">Email Us</h3>
                                <p class="text-gray-600">info@medicarepulse.com</p>
                                <p class="text-gray-600">support@medicarepulse.com</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition duration-300">
                        <div class="flex items-start">
                            <div class="bg-blue-100 p-3 rounded-full mr-4">
                                <i data-feather="phone" class="text-blue-600 w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold mb-2">Call Us</h3>
                                <p class="text-gray-600">Sandton: (011) 234 5678</p>
                                <p class="text-gray-600">Heidelberg: (016) 345 6789</p>
</div>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="lg:col-span-2 bg-white rounded-lg shadow-md p-8">
                    <h3 class="text-2xl font-bold mb-6">Get in Touch</h3>
                    <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-1">
                            <label class="block text-gray-700 font-medium">Your Name <span class="text-red-500">*</span></label>
                            <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div class="space-y-1">
                            <label class="block text-gray-700 font-medium">Your Email <span class="text-red-500">*</span></label>
                            <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div class="space-y-1">
                            <label class="block text-gray-700 font-medium">Phone Number</label>
                            <input type="tel" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="space-y-1">
                            <label class="block text-gray-700 font-medium">Subject</label>
                            <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="md:col-span-2 space-y-1">
                            <label class="block text-gray-700 font-medium">Your Message <span class="text-red-500">*</span></label>
                            <textarea rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-300">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Map Section -->
        <section class="bg-gray-100 py-16 rounded-xl">
            <div class="container mx-auto px-4">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.215373510565!2d-73.98784492401797!3d40.74844097138996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b3117469%3A0xd134e199a405a163!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1712345678901!5m2!1sen!2sus" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script>
        feather.replace();
    </script>
    <script src="script.js"></script>
</body>
</html>
