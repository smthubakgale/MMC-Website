<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazibuko Medical - Doctors</title>

    <!-- Favicon -->
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <link rel="shortcut icon" href="img/logo.ico" type="image/x-icon">

    <!-- Optional Meta -->
    <meta name="description" content="Meet the doctors at Mazibuko Medical Clinic">
    <meta name="author" content="Tevrocsoft">
    <meta name="developer" content="Tevrocsoft - https://tevrocsoft.netlify.app">

    <!-- Open Graph -->
    <meta property="og:title" content="Mazibuko Medical - Doctors">
    <meta property="og:description" content="Meet the doctors at Mazibuko Medical Clinic">
    <meta property="og:image" content="img/logo.png">
    <meta property="og:type" content="website">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/doctor-card.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>

    <main class="container mx-auto px-4 py-20">
        <!-- Doctors Hero -->
        <section class="mb-16 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Meet Our Specialists</h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto">Highly qualified and compassionate healthcare professionals dedicated to your wellbeing.</p>
        </section>

        <!-- Doctors Grid -->
        <section class="mb-16">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <custom-doctor-card 
                    name="Dr. Sarah Johnson" 
                    specialty="Cardiologist" 
                    experience="15 years" 
                    image="http://static.photos/medical/320x240/1">
                </custom-doctor-card>
                
                <custom-doctor-card 
                    name="Dr. Michael Chen" 
                    specialty="Neurologist" 
                    experience="12 years" 
                    image="http://static.photos/medical/320x240/2">
                </custom-doctor-card>
                
                <custom-doctor-card 
                    name="Dr. Emily Rodriguez" 
                    specialty="Pediatrician" 
                    experience="10 years" 
                    image="http://static.photos/medical/320x240/3">
                </custom-doctor-card>
                
                <custom-doctor-card 
                    name="Dr. James Wilson" 
                    specialty="Orthopedic Surgeon" 
                    experience="18 years" 
                    image="http://static.photos/medical/320x240/4">
                </custom-doctor-card>

                <custom-doctor-card 
                    name="Dr. Rachel Kim" 
                    specialty="Dermatologist" 
                    experience="9 years" 
                    image="http://static.photos/medical/320x240/5">
                </custom-doctor-card>

                <custom-doctor-card 
                    name="Dr. David Patel" 
                    specialty="Gastroenterologist" 
                    experience="14 years" 
                    image="http://static.photos/medical/320x240/6">
                </custom-doctor-card>

                <custom-doctor-card 
                    name="Dr. Lisa Wong" 
                    specialty="Ophthalmologist" 
                    experience="11 years" 
                    image="http://static.photos/medical/320x240/7">
                </custom-doctor-card>

                <custom-doctor-card 
                    name="Dr. Robert Thompson" 
                    specialty="ENT Specialist" 
                    experience="16 years" 
                    image="http://static.photos/medical/320x240/8">
                </custom-doctor-card>
            </div>
        </section>

        <!-- Appointment CTA -->
        <section class="mb-16 bg-gradient-to-r from-blue-500 to-teal-500 text-white rounded-xl p-8 text-center">
            <h2 class="text-3xl font-bold mb-4">Ready to Book an Appointment?</h2>
            <p class="text-xl mb-6 max-w-2xl mx-auto">Schedule your visit with one of our specialists today.</p>
            <a href="contact.html" class="inline-block bg-white text-blue-600 hover:bg-blue-50 px-8 py-3 rounded-lg font-medium text-center transition duration-300">Contact Us</a>
        </section>
    </main>

    <custom-footer></custom-footer>

    <script>
        feather.replace();
    </script>
    <script src="script.js"></script>
</body>
</html>
